[build]
buildCommand = "cd frontend && npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build && cd ../backend && pip install -r ../requirements/base.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
restartPolicyType = "on_failure"